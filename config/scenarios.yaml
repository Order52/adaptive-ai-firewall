# Attack-evaluation scenario registry (M6). The harness validates this file:
# attackers must be ATTACK-zone client addresses, targets must be on the allowlist,
# and the management (10.77.50.0/24) and database (10.77.60.0/24) networks can never be
# targets. Attack traffic is generated by the TEAM with standard tools from ATK01;
# the harness only records ground truth, enforces limits and stops ATK01 on abort.
allowed_targets:
  - {ip: 10.77.30.10, port: 443, name: WAF01 HTTPS (the only ATTACK->DMZ path FW01 permits)}
  - {ip: 10.77.30.10, port: 22, name: WAF01 SSH (blocked by FW01; IDS visibility only)}
  - {ip: 10.77.30.10, port: 80, name: WAF01 HTTP (blocked by FW01; IDS visibility only)}
  - {ip: 10.77.30.10, port: 3306, name: WAF01 MySQL port (blocked by FW01; IDS visibility only)}

scenarios:
  - id: web-bruteforce-login
    family: credential_bruteforce
    description: Rapid password guessing against the rental application's login endpoint.
    attackers: [10.77.10.10]
    targets: [{ip: 10.77.30.10, port: 443}]
    purpose: test
    max_duration_s: 900
    expected_evidence: [auth, behavior_ml]
    team_tooling: "team choice, e.g. hydra http-post-form"

  - id: web-sqli-probe
    family: sql_injection
    description: Automated SQL-injection probing of the rental API parameters.
    attackers: [10.77.10.10]
    targets: [{ip: 10.77.30.10, port: 443}]
    purpose: test
    max_duration_s: 900
    expected_evidence: [waf, behavior_ml]
    team_tooling: "team choice, e.g. sqlmap"

  - id: web-content-discovery
    family: content_discovery
    description: Forced browsing / vulnerability scanning of the web application.
    attackers: [10.77.10.10]
    targets: [{ip: 10.77.30.10, port: 443}]
    purpose: test
    max_duration_s: 900
    expected_evidence: [waf, behavior_ml]
    team_tooling: "team choice, e.g. nikto or a directory brute-forcer"

  - id: net-portscan
    family: port_scan
    description: TCP port scan of WAF01; only 443 is reachable, the rest is IDS-visible.
    attackers: [10.77.10.10]
    targets:
      - {ip: 10.77.30.10, port: 443}
      - {ip: 10.77.30.10, port: 22}
      - {ip: 10.77.30.10, port: 80}
      - {ip: 10.77.30.10, port: 3306}
    purpose: test
    max_duration_s: 600
    expected_evidence: [ids]
    team_tooling: "team choice, e.g. nmap -sS"

  - id: low-and-slow-bruteforce
    family: credential_bruteforce_slow
    description: Slow password guessing designed to stay under rate thresholds (hard case).
    attackers: [10.77.10.10]
    targets: [{ip: 10.77.30.10, port: 443}]
    purpose: holdout
    max_duration_s: 3600
    expected_evidence: [auth]
    team_tooling: "team choice, e.g. hydra with long waits"
