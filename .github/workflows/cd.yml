name: CD

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI must pass on this commit before we publish anything built from it.
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      # A tag push can start this job before CI has registered any checks on the commit;
      # the action then fails with "check never run". Give CI time to start.
      - name: Let CI register its checks
        run: sleep 45
      - uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: "Wait for CI"
          check-regexp: '(Lint|Type check|Unit \+ integration tests|Build distribution).*'
          wait-interval: 15
          allowed-conclusions: success

  docker:
    name: Build, scan, and publish image
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    permissions:
      contents: read
      packages: write
      security-events: write  # upload the Trivy report to the Security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build image (load for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy is installed directly, not through aquasecurity/trivy-action: that action tried to
      # install Trivy 0.65.0, which no longer installs, so it left no binary and this job failed on
      # every run from 2026-11-11 (found by a debug run on 2026-11-17). The install script is
      # pinned to the same tag as the version and verifies the release checksum itself.
      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.76.2
        run: |
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sh -s -- -b "$RUNNER_TEMP/bin" "${TRIVY_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # IMAGE comes from the metadata action: it lowercases the repository name, which Docker
      # requires (github.repository is 'Order52/...', with a capital letter). The GHCR login above
      # also authenticates Trivy's vulnerability-database pull.
      - name: Scan image (report, uploaded to the Security tab)
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          trivy image --format sarif --output trivy-results.sarif \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 "$IMAGE"

      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      # Hard gate: a CRITICAL vulnerability with an available fix stops the release.
      # (HIGH stays report-only above; ignore-unfixed avoids blocking on CVEs nobody can fix yet.)
      - name: Block on CRITICAL vulnerabilities
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          trivy image --format table --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.1"
      # SBOM of the exact locked dependency set (CycloneDX 1.5).
      - run: uv export --locked --no-emit-project --format cyclonedx1.5 -o sbom.cdx.json
      - run: |
          # tags with a hyphen (v1.0.0-rc.1) are SemVer pre-releases
          case "${{ github.ref_name }}" in *-*) PRE="--prerelease" ;; *) PRE="" ;; esac
          gh release create "${{ github.ref_name }}" sbom.cdx.json $PRE \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "Container image: ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
