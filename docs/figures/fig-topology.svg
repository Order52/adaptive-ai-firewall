  <!-- ================= legend / callout ================= -->
  <rect x="40" y="1080" width="1100" height="300" rx="14" fill="#ffffff" stroke="#dedad2" stroke-width="1.5"/>
  <text x="62" y="1112" font-size="14.5" font-weight="700" fill="#15140f">Isolation, verified by code (`afw lab verify`)</text>

  <text x="62" y="1142" font-size="11.5" fill="#1c1b19">✓ ATTACK and USERS can reach only WAF01:443 through FW01 — never each other, never APP01 or DB01 directly.</text>
  <text x="62" y="1164" font-size="11.5" fill="#1c1b19">✓ APP01 is the only host permitted to reach DB01:5432. The database initiates no outbound traffic of its own.</text>
  <text x="62" y="1186" font-size="11.5" fill="#1c1b19">✓ The management plane (CTRL01, DESK01) sits on its own host-only zone, reachable by clients for nothing but telemetry ingestion.</text>
  <text x="62" y="1208" font-size="11.5" fill="#1c1b19">✓ MAINT-NAT is FW01's only outbound Internet path, used solely for IDS rule updates — kept off every data zone.</text>

  <text x="62" y="1244" font-size="10.5" font-weight="700" fill="#6b6660">LEGEND</text>
  <rect x="62" y="1254" width="16" height="16" rx="3" fill="#2a78d6"/><text x="84" y="1267" font-size="11" fill="#1c1b19">Management</text>
  <rect x="210" y="1254" width="16" height="16" rx="3" fill="#d03b3b"/><text x="232" y="1267" font-size="11" fill="#1c1b19">Attack (client)</text>
  <rect x="360" y="1254" width="16" height="16" rx="3" fill="#0ca30c"/><text x="382" y="1267" font-size="11" fill="#1c1b19">Users (client)</text>
  <rect x="510" y="1254" width="16" height="16" rx="3" fill="#e08a1e"/><text x="532" y="1267" font-size="11" fill="#1c1b19">DMZ</text>
  <rect x="610" y="1254" width="16" height="16" rx="3" fill="#1b9e9e"/><text x="632" y="1267" font-size="11" fill="#1c1b19">Application</text>
  <rect x="760" y="1254" width="16" height="16" rx="3" fill="#6250d6"/><text x="782" y="1267" font-size="11" fill="#1c1b19">Database</text>
  <polygon points="900,1254 912,1260 912,1272 900,1278 888,1272 888,1260" fill="#3a3730"/><text x="922" y="1267" font-size="11" fill="#1c1b19">Firewall (FW01)</text>

  <text x="62" y="1304" font-size="10.5" fill="#6b6660">7 functional VMs (CTRL01, FW01, WAF01, APP01, DB01, USR01, ATK01) + 6 zone switches + 2 host connectors = 16 GNS3 nodes, 15 links.</text>
  <text x="62" y="1322" font-size="10.5" fill="#6b6660">Authoritative source: lab/gns3/topology.yaml · canvas generated by afw lab layout · verified live by afw lab verify.</text>
