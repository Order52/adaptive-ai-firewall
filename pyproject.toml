[project]
name = "afw"
version = "0.1.0"
description = "AI-Adaptive-Firewall: AI-driven adaptive security control plane"
authors = [
    { name = "Order52", email = "moroko7xp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "psycopg[binary]>=3.3.8",
    "psycopg-pool>=3.2.4",
    "pyyaml>=6.0.3",
    "river>=0.26.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ansible-core>=2.21.6",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.4",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20261103",
]

[project.scripts]
afw = "afw.cli:app"
afw-mcp = "afw.mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["artifacts"]  # evidence scripts are kept exactly as they were run

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PTH", "TID"]
ignore = ["S101", "S311", "RUF012", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "TID251", "E731"]
"src/afw/persistence/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy".msg = "Domain/AI layers must not import persistence frameworks"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
[[tool.mypy.overrides]]
module = ["sklearn.*", "river.*", "joblib.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
# River ships no annotations; calls into it are the only untyped boundary.
module = ["afw.ml.detectors.hst", "afw.profiling.adaptation"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["afw"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
