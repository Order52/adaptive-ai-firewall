# Optional live GUI on USR01 (USERS zone): lets an operator open a real browser on
# the one client machine real (non-simulated) country blocking actually covers
# (ADR-036), watch a site fail when its country is blocked outbound, then watch it
# work again on revoke. Viewed through GNS3's own VNC console (topology.yaml sets
# `console: vnc` for USR01; no VNC server is installed in the guest -- QEMU exposes
# the virtual display directly, same mechanism as DESK01's baked image).
#
# Deliberately NOT the `desktop` role/group: that role's tasks assume DESK01's
# baked-image launcher files, which don't exist here, and group `desktop` is
# excluded from `common` in site.yaml -- USR01 must keep `common` (host firewall,
# CA trust, chrony) and `probe` (the benign-traffic/probe agent) exactly as is.
- name: XFCE + lightdm (minimal graphical stack, no desktop-image dependency)
  ansible.builtin.apt:
    name:
      - xserver-xorg
      - xinit
      - xfwm4
      - xfce4-session
      - xfce4-panel
      - xfce4-terminal
      - xfdesktop4
      - xfce4-settings
      - lightdm
      - lightdm-gtk-greeter
      - dbus-x11
      - gvfs
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keyrings directory
  ansible.builtin.file: {path: /etc/apt/keyrings, state: directory, mode: "0755"}

- name: Mozilla apt keyring
  ansible.builtin.get_url:
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/packages.mozilla.org.asc
    mode: "0644"
  register: _moz_key

- name: Mozilla apt repo (deb package, not the snap -- so the lab CA policy below applies)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/mozilla.list
    content: "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main\n"
    mode: "0644"

- name: Pin Mozilla's Firefox over any snap/distro package
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    content: "Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n"
    mode: "0644"

- name: Install Firefox
  ansible.builtin.apt:
    name: firefox
    state: present
    update_cache: true
  when: _moz_key is succeeded

- name: Firefox policy directory
  ansible.builtin.file: {path: /etc/firefox/policies, state: directory, mode: "0755"}
- name: Lab CA for Firefox (its own certificate store, separate from the system one)
  ansible.builtin.copy: {src: "{{ afw_home }}/pki/lab-ca.pem", dest: /etc/firefox/policies/afw-lab-ca.pem, mode: "0644"}
- name: Firefox enterprise policy installing the lab CA
  ansible.builtin.copy:
    dest: /etc/firefox/policies/policies.json
    mode: "0644"
    content: '{"policies": {"Certificates": {"Install": ["/etc/firefox/policies/afw-lab-ca.pem"]}}}'

- name: lightdm autologin as the existing afw user, into an XFCE session
  ansible.builtin.copy:
    dest: /etc/lightdm/lightdm.conf.d/10-afw-autologin.conf
    mode: "0644"
    content: |
      [Seat:*]
      autologin-user=afw
      autologin-user-timeout=0
      user-session=xfce

# light-locker is pulled in as a dependency of xfce4-session and will lock the
# idle session (demanding the afw account's own password, which defeats the
# point of autologin on a kiosk-style showcase machine nobody is meant to need
# a password for). Remove it rather than just configure around it.
- name: No screen locker (always-on showcase desktop, not a personal session)
  ansible.builtin.apt:
    name: [light-locker, light-locker-settings, xfce4-screensaver]
    state: absent
    purge: true

- name: Desktop directory
  ansible.builtin.file: {path: /home/afw/Desktop, state: directory, owner: afw, group: afw, mode: "0755"}

- name: Firefox shortcut (operator picks the actual test site live -- a country's
    traffic mix changes, a hardcoded one would not age well)
  ansible.builtin.copy:
    dest: /home/afw/Desktop/Firefox.desktop
    mode: "0755"
    content: |
      [Desktop Entry]
      Version=1.0
      Type=Application
      Name=Firefox
      Exec=firefox
      Icon=firefox
      Terminal=false
  notify: own the desktop icon

# XFCE refuses to launch a desktop-icon .desktop file until it is marked trusted
# (otherwise: an "untrusted application launcher" error on double-click, no matter
# the +x bit). This needs gvfsd-metadata, hence `gvfs` above, and a live session to
# talk to -- harmless and safe to rerun if the session wasn't up yet this time
# (first boot, before the first autologin completes); it will just no-op then and
# take effect next time this role runs against an already-logged-in box.
- name: Mark the Firefox desktop icon as trusted (needs a live session; best-effort)
  ansible.builtin.command:
    cmd: gio set /home/afw/Desktop/Firefox.desktop metadata::trusted true
  become: true
  become_user: afw
  environment:
    DISPLAY: ":0"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"
  register: _trust
  changed_when: _trust.rc == 0
  failed_when: false

# Ready to present the moment someone connects: both open on login, nobody has
# to click an icon first.
- name: Firefox opens automatically on login
  ansible.builtin.copy:
    dest: /etc/xdg/autostart/afw-firefox.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Firefox (auto-start)
      Exec=firefox
      Icon=firefox
      Terminal=false
      X-GNOME-Autostart-enabled=true
- name: A terminal opens automatically on login
  ansible.builtin.copy:
    dest: /etc/xdg/autostart/afw-terminal.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Terminal (auto-start)
      Exec=xfce4-terminal
      Icon=utilities-terminal
      Terminal=false
      X-GNOME-Autostart-enabled=true

# Perceived speed over VNC/noVNC: compositing (alpha blending, drop shadows) and
# a highly detailed wallpaper both cost real encode time on every redraw across
# that link. Minimal xfconf overrides (xfconf reads these at session start and
# merges them over its schema defaults, so this doesn't need a running D-Bus
# session the way `xfconf-query` would) -- not a full dump of every property.
- name: XFCE config directory
  ansible.builtin.file:
    path: /home/afw/.config/xfce4/xfconf/xfce-perchannel-xml
    state: directory
    owner: afw
    group: afw
    mode: "0755"
    recurse: true
- name: Compositing and window-shadow effects off (xfwm4) -- the single biggest
    win for how smooth this feels over VNC
  ansible.builtin.copy:
    dest: /home/afw/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
    owner: afw
    group: afw
    mode: "0644"
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <channel name="xfwm4" version="1.0">
        <property name="general" type="empty">
          <property name="use_compositing" type="bool" value="false"/>
          <property name="show_frame_shadow" type="bool" value="false"/>
          <property name="show_popup_shadow" type="bool" value="false"/>
          <property name="show_dock_shadow" type="bool" value="false"/>
        </property>
      </channel>
- name: Plain dark background instead of the detailed default wallpaper (xfce4-desktop)
  ansible.builtin.copy:
    dest: /home/afw/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
    owner: afw
    group: afw
    mode: "0644"
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <channel name="xfce4-desktop" version="1.0">
        <property name="backdrop" type="empty">
          <property name="screen0" type="empty">
            <property name="monitor0" type="empty">
              <property name="workspace0" type="empty">
                <property name="color-style" type="int" value="0"/>
                <property name="image-style" type="int" value="0"/>
                <property name="rgba1" type="array">
                  <value type="double" value="0.08"/>
                  <value type="double" value="0.08"/>
                  <value type="double" value="0.08"/>
                  <value type="double" value="1"/>
                </property>
              </property>
            </property>
          </property>
        </property>
      </channel>

- name: Boot to a graphical session
  ansible.builtin.command: systemctl set-default graphical.target
  changed_when: true
- name: Enable lightdm
  ansible.builtin.systemd:
    name: lightdm
    enabled: true
