- name: Egress verification targets (single source of truth is config/lab.yaml, ADR-036)
  ansible.builtin.set_fact:
    probe_egress: >-
      {%- set g = (lookup('file', repo_root ~ '/config/lab.yaml') | from_yaml).geo_enforcement | default({}) -%}
      {%- for n, t in (g.egress_targets | default({})).items() -%}
      {{ n }}={{ t.address }}:{{ t.port | default(443) }}{{ '' if loop.last else ',' }}
      {%- endfor -%}
- name: Code directory
  ansible.builtin.file: {path: /opt/afw/probe, state: directory, mode: "0755"}
- name: Probe user
  ansible.builtin.user: {name: afwprobe, system: true, shell: /usr/sbin/nologin, create_home: false}
- name: Probe code
  ansible.builtin.copy: {src: "{{ repo_root }}/traffic/probe_agent.py", dest: /opt/afw/probe/probe_agent.py, mode: "0755"}
  notify: restart probe
- name: Probe token
  ansible.builtin.copy: {src: "{{ afw_home }}/tokens/probe.token", dest: /etc/afw/probe.token, owner: afwprobe, mode: "0600"}
  notify: restart probe
- name: Probe unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/afw-probe.service
    mode: "0644"
    content: |
      [Unit]
      Description=AFW enforcement verification probe agent (fixed target, single GET /health)
      After=network-online.target
      [Service]
      User=afwprobe
      Environment=AFW_PROBE_TARGET={{ waf_ip }}
      Environment=AFW_PROBE_CALLER={{ ctrl_ip }}
      Environment=AFW_LAB_CA=/etc/afw/tls/lab-ca.pem
      Environment=AFW_PROBE_TOKEN_FILE=/etc/afw/probe.token
      Environment=AFW_PROBE_EGRESS={{ probe_egress }}
      ExecStart=/usr/bin/python3 /opt/afw/probe/probe_agent.py
      Restart=on-failure
      NoNewPrivileges=true
      ProtectSystem=strict
      [Install]
      WantedBy=multi-user.target
  notify: restart probe
- name: Probe running
  ansible.builtin.systemd: {name: afw-probe, enabled: true, state: started, daemon_reload: true}
