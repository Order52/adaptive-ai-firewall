- name: restart chrony
  ansible.builtin.systemd: {name: chrony, state: restarted}
- name: update ca
  ansible.builtin.command: update-ca-certificates
- name: restart rsyslog
  ansible.builtin.systemd: {name: rsyslog, state: restarted}
- name: reload nftables
  ansible.builtin.command: nft -f /etc/nftables.conf
- name: reload sshd
  # validate first: a broken config must never reach the running daemon
  ansible.builtin.shell: /usr/sbin/sshd -t && systemctl reload ssh
- name: restart journald
  ansible.builtin.systemd: {name: systemd-journald, state: restarted}
