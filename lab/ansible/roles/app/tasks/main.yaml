- name: Code directory
  ansible.builtin.file: {path: /opt/afw/rental, state: directory, mode: "0755"}
- name: App service user
  ansible.builtin.user: {name: afwapp, system: true, shell: /usr/sbin/nologin, create_home: false}
- name: App code
  ansible.builtin.copy:
    src: "{{ repo_root }}/apps/rental/rental_app.py"
    dest: /opt/afw/rental/rental_app.py
    mode: "0644"
  notify: restart app
- name: Event log ownership
  ansible.builtin.file: {path: /var/log/afw, state: directory, owner: afwapp, mode: "0755"}
- name: App unit
  ansible.builtin.template: {src: afw-rental.service.j2, dest: /etc/systemd/system/afw-rental.service, mode: "0644"}
  notify: restart app
- name: Ship app events to CTRL01
  ansible.builtin.template: {src: 30-afw-app.conf.j2, dest: /etc/rsyslog.d/30-afw-app.conf, mode: "0644"}
  notify: restart rsyslog
- name: App running
  ansible.builtin.systemd: {name: afw-rental, enabled: true, state: started, daemon_reload: true}
