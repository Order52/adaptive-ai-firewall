# Declarative GNS3 topology for the AI-Adaptive-Firewall lab (GNS3 2.2, API v2).
# Applied idempotently by `afw lab build`. All client traffic crosses FW01;
# APP01 is reachable only from WAF01 (FW rule + host nftables).
project: AI-Adaptive-Firewall
images:
  ubuntu: afw-ubuntu-24.04-golden.qcow2
  opnsense: opnsense-26.7-nano.qcow2
switches:            # one L2 segment per zone
  SW-ATTACK: {x: -450, y: -250}
  SW-USERS:  {x: -450, y: 150}
  SW-DMZ:    {x: 250,  y: -250}
  SW-APP:    {x: 450,  y: 0}
  SW-DB:     {x: 700,  y: 250}
  SW-MGMT:   {x: 250,  y: 250}
nodes:
  FW01:
    kind: opnsense
    ram: 1536
    cpus: 2
    adapters: 7      # vtnet0 MGMT(lan) | vtnet1 WAN(maint) | vtnet2 ATTACK | vtnet3 USERS | vtnet4 DMZ | vtnet5 APP | vtnet6 DB
    x: 0
    y: 0
  CTRL01: {kind: ubuntu, ram: 2048, cpus: 2, zone: MGMT,   ip: 10.77.50.10/24, gw: 10.77.50.1, x: 450,  y: 350}
  WAF01:  {kind: ubuntu, ram: 1024, cpus: 1, zone: DMZ,    ip: 10.77.30.10/24, gw: 10.77.30.1, x: 250,  y: -450}
  APP01:  {kind: ubuntu, ram: 768,  cpus: 1, zone: APP,    ip: 10.77.40.10/24, gw: 10.77.40.1, x: 700,  y: 0}
  DB01:   {kind: ubuntu, ram: 768,  cpus: 1, zone: DB,     ip: 10.77.60.10/24, gw: 10.77.60.1, x: 950,  y: 250}
  USR01:  {kind: ubuntu, ram: 768,  cpus: 1, zone: USERS,  ip: 10.77.20.10/24, gw: 10.77.20.1, extra_ips: [10.77.20.250/24], x: -700, y: 150}
  ATK01:  {kind: ubuntu, ram: 768,  cpus: 1, zone: ATTACK, ip: 10.77.10.10/24, gw: 10.77.10.1, extra_ips: [10.77.10.250/24], x: -700, y: -250}
  HOST-MGMT: {kind: cloud, tap: afw-mgmt0, x: 0, y: 400}
  MAINT-NAT: {kind: nat, x: -250, y: 400}
links:               # [node, adapter, port] pairs
  - [[FW01, 0, 0], [SW-MGMT, 0, 0]]
  - [[FW01, 1, 0], [MAINT-NAT, 0, 0]]
  - [[FW01, 2, 0], [SW-ATTACK, 0, 0]]
  - [[FW01, 3, 0], [SW-USERS, 0, 0]]
  - [[FW01, 4, 0], [SW-DMZ, 0, 0]]
  - [[FW01, 5, 0], [SW-APP, 0, 0]]
  - [[FW01, 6, 0], [SW-DB, 0, 0]]
  - [[CTRL01, 0, 0], [SW-MGMT, 0, 1]]
  - [[HOST-MGMT, 0, 0], [SW-MGMT, 0, 2]]
  - [[WAF01, 0, 0], [SW-DMZ, 0, 1]]
  - [[APP01, 0, 0], [SW-APP, 0, 1]]
  - [[DB01, 0, 0], [SW-DB, 0, 1]]
  - [[USR01, 0, 0], [SW-USERS, 0, 1]]
  - [[ATK01, 0, 0], [SW-ATTACK, 0, 1]]
